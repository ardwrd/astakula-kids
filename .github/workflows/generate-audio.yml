name: Generate Indonesian narration

on:
  push:
    branches: [main]
    paths:
      - 'scripts/audio-batch.request'
  workflow_dispatch:
    inputs:
      voice_id:
        description: 'auto discovers an eligible Voice Design or Default voice; alternatively enter a Voice ID'
        type: string
        required: true
        default: 'Z1zqlZPdl4KqSeH7Nm4L'
      limit:
        description: 'Maximum clips this run (1-100; default 3)'
        type: string
        required: false
        default: '3'

permissions:
  contents: write

concurrency:
  group: astakula-kids-audio
  cancel-in-progress: false

jobs:
  synthesize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate secret availability
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          if [ -z "$ELEVENLABS_API_KEY" ]; then
            echo "::error::ELEVENLABS_API_KEY is missing from repository Actions secrets"
            exit 1
          fi
      - name: Generate narration
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          VOICE_ID: ${{ github.event_name == 'push' && 'Z1zqlZPdl4KqSeH7Nm4L' || inputs.voice_id }}
          CLIP_LIMIT: ${{ github.event_name == 'push' && '35' || inputs.limit }}
        run: python scripts/generate_audio.py --voice-id "$VOICE_ID" --limit "$CLIP_LIMIT"
      - name: Commit generated files
        if: ${{ success() || failure() }}
        run: |
          if [ ! -d public/audio/generated ]; then
            echo "No generated audio directory yet."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/audio/generated/ src/data/audioManifest.json
          if ! git diff --cached --quiet; then
            git commit -m "assets(audio): generate Indonesian narration"
            git push
          else
            echo "No new audio files to commit."
          fi
