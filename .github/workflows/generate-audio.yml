name: Generate Indonesian narration

on:
  workflow_dispatch:
    inputs:
      voice_id:
        description: 'ElevenLabs voice ID selected in your ElevenLabs account'
        type: string
        required: true
        default: 'U3dExJoUNcmTY5H6GMuG'
      limit:
        description: 'Maximum clips this run (1-100; default 3)'
        type: string
        required: false
        default: '3'

permissions:
  contents: write

concurrency:
  group: astakula-kids-audio
  cancel-in-progress: false

jobs:
  synthesize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate secret availability
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          if [ -z "$ELEVENLABS_API_KEY" ]; then
            echo "::error::ELEVENLABS_API_KEY is missing from repository Actions secrets"
            exit 1
          fi
      - name: Generate narration
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          VOICE_ID: ${{ inputs.voice_id }}
          CLIP_LIMIT: ${{ inputs.limit }}
        run: python scripts/generate_audio.py --voice-id "$VOICE_ID" --limit "$CLIP_LIMIT"
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/audio/generated/ src/data/audioManifest.json
          if ! git diff --cached --quiet; then
            git commit -m "assets(audio): generate Indonesian narration"
            git push
          else
            echo "No new audio files to commit."
          fi
