name: Build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: python3 -m py_compile scripts/generate_audio.py scripts/discover_elevenlabs_voice.py scripts/generate_prosody_previews.py scripts/generate_v4_candidates.py
      - run: python3 scripts/generate_v4_candidates.py --validate
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
