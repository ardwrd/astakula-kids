name: Generate adaptive kids narrator batch

on:
  push:
    branches: [main]
    paths:
      - 'scripts/kids-adaptive-voice.request'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: astakula-kids-adaptive-voice
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate 104 scripts
        run: python scripts/generate_kids_adaptive_voice.py --validate
      - name: Generate max 10 new MP3 previews
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python scripts/generate_kids_adaptive_voice.py --limit 10
      - name: Backup completed previews
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: kids-adaptive-narration
          path: public/audio/previews/indo-v4-adaptive-v2/
          if-no-files-found: warn
          retention-days: 14
      - name: Save successful preview assets even when quota interrupts
        if: ${{ success() || failure() }}
        run: |
          if [ ! -f public/audio/previews/indo-v4-adaptive-v2/manifest.json ]; then
            echo 'No generated previews yet'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/audio/previews/indo-v4-adaptive-v2
          if ! git diff --cached --quiet; then
            git commit -m 'assets(audio): stage adaptive narration candidates'
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo 'Staged candidate audio saved'
                exit 0
              fi
              sleep 3
            done
            echo 'Unable to commit; review backup artifact'
            exit 1
          fi
          echo 'No additional preview assets'
